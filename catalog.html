<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог - LKNLN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Шапка (упрощенная) -->
    <header class="header header-dark">
        <a href="index.html" class="logo-text">LKNLN</a>
        <nav class="nav-left">
            <a href="catalog.html">Каталог</a>
            <a href="#">О нас</a>
            <a href="#">Контакты</a>
        </nav>
        <div class="nav-right">
            <button class="icon-btn">🔍</button>
            <button class="icon-btn">🛒</button>
        </div>
    </header>

    <!-- Заголовок каталога -->
    <section class="catalog-header">
        <h1>Все товары</h1>
        <p>Весенняя коллекция 2026</p>
    </section>

    <!-- Сетка товаров -->
    <section class="catalog">
        <div class="grid">
            
            <!-- Карточка товара 1 -->
            <a href="product.html" class="card">
                <img src="https://images.unsplash.com/photo-1551537482-f2075a1d41f2?q=80&w=600&auto=format&fit=crop" alt="Джинсовая куртка">
                <div class="card-info">
                    <div>
                        <h3>Джинсовая куртка</h3>
                        <p class="price">5 900 ₽</p>
                    </div>
                    <span class="arrow-btn">→</span>
                </div>
            </a>

            <!-- Карточка товара 2 -->
            <a href="product.html" class="card">
                <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?q=80&w=600&auto=format&fit=crop" alt="Джинсы Wide Leg">
                <div class="card-info">
                    <div>
                        <h3>Джинсы Wide Leg</h3>
                        <p class="price">7 200 ₽</p>
                    </div>
                    <span class="arrow-btn">→</span>
                </div>
            </a>

            <!-- Карточка товара 3 -->
            <a href="product.html" class="card">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=600&auto=format&fit=crop" alt="Базовая футболка">
                <div class="card-info">
                    <div>
                        <h3>Базовая футболка</h3>
                        <p class="price">2 500 ₽</p>
                    </div>
                    <span class="arrow-btn">→</span>
                </div>
            </a>

            <!-- Карточка товара 4 -->
            <a href="product.html" class="card">
                <img src="https://images.unsplash.com/photo-1591195853828-11db59a44f6b?q=80&w=600&auto=format&fit=crop" alt="Джинсовые шорты">
                <div class="card-info">
                    <div>
                        <h3>Джинсовые шорты</h3>
                        <p class="price">4 100 ₽</p>
                    </div>
                    <span class="arrow-btn">→</span>
                </div>
            </a>

            <!-- Карточка товара 5 -->
            <a href="product.html" class="card">
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600&auto=format&fit=crop" alt="Топ на бретелях">
                <div class="card-info">
                    <div>
                        <h3>Топ на бретелях</h3>
                        <p class="price">3 200 ₽</p>
                    </div>
                    <span class="arrow-btn">→</span>
                </div>
            </a>

            <!-- Карточка товара 6 -->
            <a href="product.html" class="card">
                <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?q=80&w=600&auto=format&fit=crop" alt="Очки">
                <div class="card-info">
                    <div>
                        <h3>Очки</h3>
                        <p class="price">4 800 ₽</p>
                    </div>
                    <span class="arrow-btn">→</span>
                </div>
            </a>

        </div>
    </section>
</body>
</html>
