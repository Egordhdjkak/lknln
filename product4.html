<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Футболки - LKNLN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Шапка -->
    <header class="header header-dark">
        <a href="index.html" class="logo-text">LKNLN</a>
        <nav class="nav-left">
            <a href="catalog.html">Каталог</a>
            <a href="#">О нас</a>
            <a href="#">Контакты</a>
        </nav>
    </header>

    <!-- Основной блок товара -->
    <section class="product-page">
        <div class="product-container">
            
            <!-- Левая часть: Фото -->
            <div class="product-image">
                <img src="-10.jpg" alt="Футболка">
            </div>

            <!-- Правая часть: Информация -->
            <div class="product-info">
                <h1>Футболка</h1>
                <p class="product-price">2 900 ₽</p>
                
                <p class="product-desc">Классическая футболка свободного кроя. Сделана из 100% хлопка. Отлично подходит для создания базового гардероба в стиле гранж или стрит-стайл.</p>

                <!-- Выбор размера -->
                <div class="sizes">
                    <p>Выберите размер:</p>
                    <div class="size-buttons">
                        <button>S</button>
                        <button>M</button>
                        <button>L</button>
                        <button>XL</button>
                    </div>
                </div>

                <!-- Кнопка Купить -->
                <button class="btn-add-to-cart">Добавить в корзину</button>
                
                <a href="catalog.html" class="back-link">← Вернуться в каталог</a>
            </div>

        </div>
    </section>

</body>
</html>
