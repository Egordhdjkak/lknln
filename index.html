<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKNLN - Магазин одежды</title>
    <!-- Подключаем шрифт Inter для современного вида -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Главный баннер -->
    <section class="hero">
        <!-- Шапка сайта поверх картинки -->
        <header class="header">
            <nav class="nav-left">
                <a href="#">Каталог</a>
                <a href="#">Информация</a>
                <a href="#">Контакты</a>
            </nav>
            <div class="nav-right">
                <button class="icon-btn">🔍</button>
                <button class="icon-btn">🛒</button>
            </div>
        </header>

        <!-- Контент внутри баннера -->
        <div class="hero-content">
            <h1 class="logo">LKNLN</h1>
            <p class="subtitle">new spring collection</p>
            <a href="#catalog" class="btn-pill">в каталог</a>
        </div>
    </section>

    <!-- Иконки преимуществ (О бренде, Доставка и т.д.) -->
    <section class="features">
        <div class="feature-item">
            <div class="circle-img">
                <img src="images/cap.jpg" alt="О бренде">
            </div>
            <span>о бренде</span>
        </div>
        <div class="feature-item">
            <div class="circle-img">
                <img src="images/caps.jpg" alt="Доставка">
            </div>
            <span>доставка и оплата</span>
        </div>
        <div class="feature-item">
            <div class="circle-img">
                <img src="images/short.jpg" alt="Возврат">
            </div>
            <span>возврат и обмен</span>
        </div>
        <div class="feature-item">
            <div class="circle-img">
                <img src="images/dior.jpg" alt="Сотрудничество">
            </div>
            <span>сотрудничество</span>
        </div>
    </section>

    <!-- Сетка с товарами -->
    <section class="catalog" id="catalog">
        <div class="section-title">
            <h2>NEW DROP</h2>
            <p>новинки</p>
        </div>

        <div class="grid">
            <!-- Карточка 1 -->
            <a href="product.html" class="card">
                <img src="images/shorts.jpg" alt="Верхняя одежда">
                <div class="card-info">
                    <h3>ВЕРХНЯЯ<br>ОДЕЖДА</h3>
                    <span class="arrow-btn">→</span>
                </div>
            </a>

            <!-- Карточка 2 -->
            <a href="product2.html" class="card">
                <img src="images/cap.jpg"Джинсы">
                <div class="card-info">
                    <h3>ДЖИНСЫ</h3>
                    <span class="arrow-btn">→</span>
                </div>
            </a>

            <!-- Карточка 3 -->
            <a href="product3.html" class="card">
                <img src="images/short.jpg" alt="Аксессуары">
                <div class="card-info">
                    <h3>АКСЕССУАРЫ</h3>
                    <span class="arrow-btn">→</span>
                </div>
            </a>

            <!-- Карточка 4 -->
            <a href="product4.html" class="card">
                <img src="images/caps.jpg" alt="Футболки">
                <div class="card-info">
                    <h3>ФУТБОЛКИ</h3>
                    <span class="arrow-btn">→</span>
                </div>
            </a>

            <!-- Карточка 5 -->
            <a href="product5.html" class="card">
                <img src="images/gap.jpg" alt="Топы">
                <div class="card-info">
                    <h3>ТОПЫ</h3>
                    <span class="arrow-btn">→</span>
                </div>
            </a>

            <!-- Карточка 6 -->
            <a href="product6.html" class="card">
                <img src="images/short.jpg" alt="Шорты">
                <div class="card-info">
                    <h3>ШОРТЫ</h3>
                    <span class="arrow-btn">→</span>
                </div>
            </a>
        </div>
    </section>

</body>
</html>
